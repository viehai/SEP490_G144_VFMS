<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VFMS - V-Fitness Management System</title>
    <base href="/" />
    <link rel="preload" as="script" href="_framework/blazor.webassembly.js" />
    <script src="js/customer-setup.js"></script>
    <link href="css/splash.css" rel="stylesheet" />
    
    <!-- Google Fonts: Montserrat (Headings) & Inter (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet"></noscript>
    
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png?v=2" />
    <link href="VFMS.Client.styles.css" rel="stylesheet" />
    <link href="css/facility-map.css?v=3" rel="stylesheet" />
    <link href="css/auth.css" rel="stylesheet" />
    <link href="css/workspace.css" rel="stylesheet" />
    <link href="css/dashboards.css" rel="stylesheet" />
    <link href="css/profile.css" rel="stylesheet" />
    <link href="css/trainers.css?v=2" rel="stylesheet" />
    <script src="js/trainer-files.js" defer></script>
    <style>
        html, body {
            overflow-x: hidden !important;
            width: 100% !important;
            max-width: 100vw !important;
        }
    </style>
    <link href="css/tailwind.css" rel="stylesheet" />
</head>

<body>
    <template id="vfms-splash-template">
        <div id="vfms-splash" class="vfms-splash" role="status" aria-live="polite">
            <div class="splash-content">
                <div class="splash-logo-wrapper">
                    <img class="splash-logo" src="images/victor-fitness-dark.png" alt="VICTOR FITNESS" />
                    <div class="splash-shine" aria-hidden="true"></div>
                </div>
                <div class="splash-loader" aria-hidden="true">
                    <div class="splash-progress"></div>
                </div>
                <p class="splash-status">Đang khởi tạo hệ thống...</p>
            </div>
            <div class="splash-footer">VFMS · V-FITNESS MANAGEMENT</div>
        </div>
    </template>
    <script>
        const startupSplash = (async () => {
            const url = new URL(location.href);
            const launched = url.searchParams.get('vfms-startup') === '1';
            if (launched) {
                url.searchParams.delete('vfms-startup');
                history.replaceState(history.state, '', url);
            }
            const seenKey = 'vfms.splash.seen';
            function claimFirstVisit() {
                if (localStorage.getItem(seenKey)) return false;
                localStorage.setItem(seenKey, '1');
                return true;
            }
            let firstVisit = false;
            try {
                if (!localStorage.getItem(seenKey)) {
                    firstVisit = navigator.locks
                        ? await navigator.locks.request(seenKey, claimFirstVisit)
                        : claimFirstVisit();
                }
            } catch { /* With storage disabled, only an explicit Run shows the splash. */ }
            if (!launched && !firstVisit) return null;

            const template = document.getElementById('vfms-splash-template');
            template.replaceWith(template.content);
            return document.getElementById('vfms-splash');
        })();
    </script>
    <div id="app"></div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="js/modal.js"></script>
    <script src="js/freeze-documents.js"></script>
    <script src="js/invoice-download.js"></script>
    <script src="js/vnd-input.js"></script>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        (async function () {
            const splash = await startupSplash;
            try {
                await Blazor.start();
                if (!splash) return;
                splash.addEventListener('transitionend', function (event) {
                    if (event.target === splash && event.propertyName === 'opacity') splash.remove();
                });
                splash.classList.add('splash-hidden');
            } catch (error) {
                console.error('VFMS startup failed:', error);
                if (!splash) {
                    document.getElementById('blazor-error-ui').style.display = 'block';
                    return;
                }
                document.querySelector('.splash-status').textContent =
                    'Không thể khởi động hệ thống. Vui lòng tải lại trang.';
                document.querySelector('.splash-progress').classList.add('splash-progress-error');
            }
        })();
    </script>
</body>

</html>
